<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗓️ Farm Reminders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf5 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #ff6b9d, #ff2e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .menu {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }
        .menu a {
            padding: 10px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .menu .home { background: #1a1a2e; color: white; }
        .menu .dashboard { background: linear-gradient(135deg, #6c5ce7, #a18cd1); color: white; }
        .menu .reminders { background: linear-gradient(135deg, #ff6b9d, #ff2e63); color: white; }
        .menu .logout { background: #c62828; color: white; }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .card h2 {
            color: #1a1a2e;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #1a1a2e;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #ff6b9d;
            outline: none;
        }
        .btn-add {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b9d, #ff2e63);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 46, 99, 0.35);
        }
        .reminder-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        .reminder-item:last-child {
            border-bottom: none;
        }
        .reminder-item .title {
            font-weight: 600;
            font-size: 16px;
        }
        .reminder-item .date {
            color: #888;
            font-size: 14px;
        }
        .reminder-item .desc {
            font-size: 14px;
            color: #666;
        }
        .reminder-item .actions a {
            text-decoration: none;
            margin-left: 10px;
            font-size: 14px;
        }
        .reminder-item .actions .done {
            color: #2e7d32;
        }
        .reminder-item .actions .delete {
            color: #ff2e63;
        }
        .empty-msg {
            text-align: center;
            color: #999;
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🗓️ Farm Reminders</h1>
        <p>Never miss a farm task!</p>
    </div>

    <div class="menu">
        <a href="/" class="home">🏠 Home</a>
        <a href="/dashboard" class="dashboard">📊 Dashboard</a>
        <a href="/reminders" class="reminders">🗓️ Reminders</a>
        <a href="/logout" class="logout">🚪 Logout</a>
    </div>

    <!-- ===== ADD REMINDER FORM ===== -->
    <div class="card">
        <h2>📝 Add New Reminder</h2>
        <form action="/add-reminder" method="post">
            <div class="form-group">
                <label>Reminder Title</label>
                <input type="text" name="title" placeholder="e.g., Fertilize coconut trees" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="e.g., Use organic fertilizer for 50 trees" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" name="date" required>
            </div>
            <button type="submit" class="btn-add">➕ Add Reminder</button>
        </form>
    </div>

    <!-- ===== REMINDERS LIST ===== -->
    <div class="card">
        <h2>📋 Your Reminders</h2>
        <div th:each="reminder : ${reminders}" class="reminder-item">
            <div>
                <div class="title" th:text="${reminder.title}"></div>
                <div class="desc" th:text="${reminder.description}"></div>
                <div class="date">📅 <span th:text="${reminder.reminderDate}"></span></div>
            </div>
            <div class="actions">
                <a th:href="@{/complete-reminder/{id}(id=${reminder.id})}" class="done">✅ Done</a>
                <a th:href="@{/delete-reminder/{id}(id=${reminder.id})}" class="delete">🗑️ Delete</a>
            </div>
        </div>
        <div th:if="${reminders.isEmpty()}" class="empty-msg">
            No reminders yet. Add one above! 🌾
        </div>
    </div>
</div>
</body>
</html>
